# Enable Spring Batch features and ensure job is run on startup (default behavior but good to be explicit for learning)
spring.batch.job.enabled=true

# Database Configuration (In-Memory H2 Database)
# Spring Batch uses a database to track the exact state of jobs, steps, and executions.
spring.datasource.url=jdbc:h2:mem:batchdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Set batch initialization mode to ALWAYS so Spring Batch will create its required tables automatically on startup
spring.batch.jdbc.initialize-schema=always

# Logging configuration to view Spring Batch execution details clearly
logging.level.org.springframework.batch=INFO
logging.level.com.canteen.batch=DEBUG
