<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Studio - Premium QR Code Generator</title>
    <meta name="description" content="Generate high-quality, custom styled QR codes instantly. Choose colors, sizes, and formats. Scan-ready for all devices.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-glow">
        <div class="glow-circle glow-1"></div>
        <div class="glow-circle glow-2"></div>
    </div>

    <header class="app-header">
        <div class="logo-container">
            <div class="logo-icon">
                <i data-lucide="qr-code"></i>
            </div>
            <h1>QR Studio</h1>
        </div>
        <p class="tagline">Generate premium, custom-styled QR codes instantly</p>
    </header>

    <main class="app-container">
        <div class="dashboard-grid">
            <!-- Left Side: Controls -->
            <section class="glass-card controls-section">
                <h2 class="section-title"><i data-lucide="sliders"></i> Customize QR Code</h2>
                
                <form id="qr-form" onsubmit="event.preventDefault();">
                    <!-- Text/URL Input -->
                    <div class="form-group">
                        <label for="qr-text">QR Content (URL or Text)</label>
                        <div class="input-wrapper">
                            <textarea id="qr-text" placeholder="Enter link, text, or Wi-Fi details here..." required rows="4"></textarea>
                            <span class="char-count">0 / 2000</span>
                        </div>
                    </div>

                    <!-- Colors -->
                    <div class="form-row">
                        <div class="form-group half-width">
                            <label for="fg-color">Foreground Color</label>
                            <div class="color-picker-wrapper">
                                <input type="color" id="fg-color" value="#0f172a">
                                <span class="color-value">#0F172A</span>
                            </div>
                        </div>
                        <div class="form-group half-width">
                            <label for="bg-color">Background Color</label>
                            <div class="color-picker-wrapper">
                                <input type="color" id="bg-color" value="#ffffff">
                                <span class="color-value">#FFFFFF</span>
                            </div>
                        </div>
                    </div>

                    <!-- Color Presets -->
                    <div class="form-group">
                        <label>Preset Themes</label>
                        <div class="presets-container">
                            <button type="button" class="preset-btn active" data-fg="#0f172a" data-bg="#ffffff" style="--fg-theme:#0f172a; --bg-theme:#ffffff;">Classic</button>
                            <button type="button" class="preset-btn" data-fg="#3b82f6" data-bg="#ffffff" style="--fg-theme:#3b82f6; --bg-theme:#ffffff;">Ocean Blue</button>
                            <button type="button" class="preset-btn" data-fg="#ec4899" data-bg="#ffffff" style="--fg-theme:#ec4899; --bg-theme:#ffffff;">Vibrant Pink</button>
                            <button type="button" class="preset-btn" data-fg="#10b981" data-bg="#ffffff" style="--fg-theme:#10b981; --bg-theme:#ffffff;">Emerald</button>
                            <button type="button" class="preset-btn" data-fg="#ffffff" data-bg="#1e1b4b" style="--fg-theme:#ffffff; --bg-theme:#1e1b4b;">Dark Velvet</button>
                        </div>
                    </div>

                    <!-- Size & Format & ECL -->
                    <div class="form-row">
                        <div class="form-group third-width">
                            <label for="qr-size">Size (px)</label>
                            <select id="qr-size">
                                <option value="200">200 x 200</option>
                                <option value="300" selected>300 x 300</option>
                                <option value="400">400 x 400</option>
                                <option value="600">600 x 600</option>
                            </select>
                        </div>
                        <div class="form-group third-width">
                            <label for="qr-format">Format</label>
                            <select id="qr-format">
                                <option value="png" selected>PNG</option>
                                <option value="jpg">JPEG</option>
                            </select>
                        </div>
                        <div class="form-group third-width">
                            <label for="qr-ecl" title="Error Correction Level determines scan-resilience to dirt or damage">Precision</label>
                            <select id="qr-ecl">
                                <option value="L">L (Low - 7%)</option>
                                <option value="M" selected>M (Medium - 15%)</option>
                                <option value="Q">Q (High - 25%)</option>
                                <option value="H">H (Max - 30%)</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="generate-btn" class="primary-btn">
                        <span class="btn-text">Generate QR Code</span>
                        <div class="btn-loader hidden">
                            <span class="spinner"></span>
                        </div>
                    </button>
                </form>
            </section>

            <!-- Right Side: Preview & History -->
            <div class="preview-column">
                <!-- Preview Section -->
                <section class="glass-card preview-section">
                    <h2 class="section-title"><i data-lucide="eye"></i> Live Preview</h2>
                    
                    <div class="preview-display">
                        <div id="qr-placeholder" class="qr-placeholder-state">
                            <div class="placeholder-icon">
                                <i data-lucide="qr-code"></i>
                            </div>
                            <p>Enter text and click generate to view your custom QR code.</p>
                        </div>

                        <div id="qr-result-container" class="qr-result-state hidden">
                            <div class="qr-image-wrapper">
                                <img id="qr-image" src="" alt="Generated QR Code">
                            </div>
                            <div class="action-buttons">
                                <button type="button" id="download-btn" class="secondary-btn">
                                    <i data-lucide="download"></i> Download Image
                                </button>
                                <button type="button" id="share-btn" class="secondary-btn">
                                    <i data-lucide="share-2"></i> Copy Link
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- History Section -->
                <section class="glass-card history-section">
                    <div class="history-header">
                        <h2 class="section-title"><i data-lucide="history"></i> Session History</h2>
                        <button type="button" id="clear-history-btn" class="text-btn hidden">Clear All</button>
                    </div>
                    <div id="history-list" class="history-list">
                        <p class="empty-history-text">No QR codes generated yet in this session.</p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 QR Studio. Powered by Google ZXing & Spring Boot.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
